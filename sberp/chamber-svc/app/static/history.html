<!doctype html>
<html lang="ko" class="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시험장 사용 이력</title>
<script>try { if (localStorage.getItem('chamberTheme') === 'dark') document.documentElement.classList.remove('light'); } catch (e) {}</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <a class="logo" href="./"><img src="logo.svg" alt="Standard Bank"></a>
  <nav><a href="./">시험장 현황판</a><a class="on" href="history.html">시험장 사용 이력</a><a id="navAdmin" href="admin.html" hidden>관리</a></nav>
  <div class="sp"></div>
  <button class="hbtn" id="thBtn" data-tip="다크 모드"><i class="ic ic-moon"></i></button>
  <div class="acct" id="acct"><div class="av" id="accAv"></div><div><div class="nm" id="who"></div><span class="rb" id="accRb"></span></div><span class="caret"><i class="ic ic-down"></i></span>
    <div class="menu" id="menu"><button class="lo" id="logout">로그아웃</button></div></div>
</header>
<div id="notice"></div>
<main class="page">
  <div class="h-top"><h2>시험장 사용 이력</h2></div>
  <form class="box fbox" id="form">
    <label>기간</label>
    <div class="filters">
      <button type="button" class="chip" data-p="0">오늘</button>
      <button type="button" class="chip" data-p="7">최근 7일</button>
      <button type="button" class="chip act" data-p="30">최근 30일</button>
      <span class="div"></span>
      <input type="date" class="inp" id="from" required> ~ <input type="date" class="inp" id="to" required>
      <span class="mark">종료일 기준</span>
    </div>
    <label>조건</label>
    <div class="filters">
      <select class="inp" id="floor"><option value="">층 전체</option></select>
      <select class="inp" id="chamber"><option value="">시험장 전체</option></select>
      <select class="inp" id="src">
        <option value="">구분 전체</option>
        <option value="RAW">시험 (로데이터)</option>
        <option value="TEST">시험 (현황판)</option>
        <option value="NOTEST">시험번호 없이 사용</option>
      </select>
      <label class="chk"><input type="checkbox" id="deleted"> 삭제 포함</label>
    </div>
    <div class="fbtns"><button type="button" class="btn sec" id="reset">초기화</button><button class="btn pri">조회</button></div>
  </form>
  <div class="box lbox">
    <div class="lbox-h"><div><b>조회 결과</b><span class="s" id="sum"></span></div></div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>구분</th><th>층</th><th>시험장</th><th>구역</th><th>내용</th><th>사용자</th><th>시작</th><th>종료</th><th>사용 시간</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>
<script src="app.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let CHAMBERS = [];

// 시험장 목록은 고른 층의 것만
function drawChambers() {
  const f = $('floor').value, cur = $('chamber').value;
  const cs = CHAMBERS.filter(x => !f || String(x.floor) === f);
  $('chamber').innerHTML = '<option value="">시험장 전체</option>' +
    cs.map(x => `<option value="${x.chamberSeq}">${x.floor}F · ${esc(x.chamberName)}</option>`).join('');
  if (cs.some(x => String(x.chamberSeq) === cur)) $('chamber').value = cur;
}

function iso(d) {
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}

function notice(msg) {
  $('notice').textContent = msg || '';
  $('notice').classList.toggle('on', !!msg);
}

function rowHtml(r) {
  const what = r.src === 'RAW'
    ? `${esc(r.testId || '시험')} · ${esc(r.metKey)}${r.prdctName ? `<span class="co">${esc(r.prdctName)}</span>` : ''}`
    : r.purpose === 'TEST'
      ? `${esc(r.testId || '시험')}${r.prdctName ? `<span class="co">${esc(r.prdctName)}</span>` : ''}${r.memo ? `<span class="co">${esc(r.memo)}</span>` : ''}`
      : `${esc(r.purposeName)}${r.memo ? `<span class="co">${esc(r.memo)}</span>` : ''}`;
  // 삭제한 건: 흐린 줄 + 삭제한 사람·시각·사유. 종료 칸은 삭제 시각(종료 전에 지운 경우), 합계에서는 빠진다
  const del = r.delYn
    ? `<div class="delinfo">삭제 ${esc(r.delMemName || '')} · ${esc(r.delDt || '')} · ${esc(r.delReason || '')}</div>`
    : '';
  return `<tr${r.delYn ? ' class="deleted"' : ''}>` +
    `<td>${r.src === 'RAW' ? '시험 (로데이터)' : r.purpose === 'TEST' ? '시험 (현황판)' : '<span class="tag">시험번호 없이 사용</span>'}${r.delYn ? '<b class="deltag">삭제</b>' : ''}</td>` +
    `<td><span class="fbadge">${r.floor}F</span></td><td><b>${esc(r.chamberName)}</b></td>` +
    `<td>${esc(zoneLabel(r.zoneName))}</td><td>${what}${del}</td><td>${esc(r.memName)}</td>` +
    `<td>${esc(r.startDt)}</td><td>${esc(r.endDt)}</td><td class="dur">${minText(r.useMin)}</td></tr>`;
}

async function search() {
  const q = new URLSearchParams({ from: $('from').value, to: $('to').value, src: $('src').value });
  if ($('chamber').value) q.set('chamberSeq', $('chamber').value);
  if ($('floor').value) q.set('floor', $('floor').value);
  if ($('deleted').checked) q.set('deleted', 'true');
  try {
    const d = await api('api/history?' + q);
    $('rows').innerHTML = d.rows.length
      ? d.rows.map(rowHtml).join('')
      : '<tr><td colspan="9" class="empty">조회 결과가 없습니다</td></tr>';
    const delCnt = d.rows.filter(r => r.delYn).length;
    $('sum').textContent = `${d.rows.length}건` +
      (delCnt ? ` (삭제 ${delCnt}건 포함)` : '') +
      ` · 총 ${minText(d.totalMin)}` + (delCnt ? ' (삭제 제외)' : '') +
      (d.truncated ? ' · 건수가 많아 최근 기록만 보여 줍니다. 기간을 줄여 주세요.' : '');
    notice('');
  } catch (e) {
    notice(e.message);
  }
}

function setPeriod(days) {
  const today = new Date();
  $('to').value = iso(today);
  $('from').value = iso(new Date(today.getTime() - days * 86400000));
  document.querySelectorAll('[data-p]').forEach(b => b.classList.toggle('act', Number(b.dataset.p) === days));
}

document.querySelectorAll('[data-p]').forEach(b =>
  b.addEventListener('click', () => { setPeriod(Number(b.dataset.p)); search(); }));
['from', 'to'].forEach(id => $(id).addEventListener('change', () =>
  document.querySelectorAll('[data-p]').forEach(b => b.classList.remove('act'))));
$('form').addEventListener('submit', (e) => { e.preventDefault(); search(); });
$('floor').addEventListener('change', drawChambers);
$('reset').addEventListener('click', () => {
  $('floor').value = ''; drawChambers(); $('chamber').value = ''; $('src').value = ''; $('deleted').checked = false;
  setPeriod(30); search();
});

(async () => {
  try {
    await initPage();
    CHAMBERS = (await api('api/chambers')).chambers;
    $('floor').insertAdjacentHTML('beforeend', [...new Set(CHAMBERS.map(x => x.floor))]
      .map(f => `<option value="${f}">${f}층</option>`).join(''));
    drawChambers();
  } catch (e) {
    notice('연결 끊김: ' + e.message);
    return;
  }
  setPeriod(30);
  search();
})();
</script>
</body>
</html>
