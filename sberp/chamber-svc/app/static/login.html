<!doctype html>
<html lang="ko" class="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시험장 현황판 로그인</title>
<script>try { if (localStorage.getItem('chamberTheme') === 'dark') document.documentElement.classList.remove('light'); } catch (e) {}</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<section id="login">
  <button class="hbtn lth" id="thBtn" data-tip="다크 모드"><i class="ic ic-moon"></i></button>
  <form class="lcard" id="form">
    <div class="logo"><img src="logo.svg" alt="Standard Bank"></div>
    <h1>시험장 현황판</h1>
    <p class="sub">ERP 계정으로 로그인하세요</p>
    <input class="inp" id="id" placeholder="ERP 아이디" autocomplete="username" maxlength="20" required autofocus>
    <input class="inp" id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" required>
    <div class="lerr" id="err"></div>
    <button class="btn pri lbtn" id="btn">로그인</button>
    <div id="viewer" hidden>
      <div class="vdiv"><span>또는</span></div>
      <a class="vbtn" href="./?kiosk=1"><b><i class="ic ic-max"></i> 모니터링 화면으로 보기</b><span>로그인 없이 현황판만 표시 · 화면을 켜 두면 계속 유지됩니다</span></a>
    </div>
    <div class="lfoot">비밀번호 변경·잠금 해제는 ERP에서 합니다</div>
  </form>
</section>
<script src="app.js"></script>
<script>
initTheme();
// 모니터로 등록된 PC(…/monitor?key= 로 연 적이 있는 브라우저)에만 [모니터링 화면으로 보기]를 보인다
fetch('api/kiosk', { credentials: 'same-origin' }).then(r => r.json())
  .then(d => { document.getElementById('viewer').hidden = !d.kiosk; }).catch(() => {});
// 누르면 브라우저 전체 화면으로 모니터 화면을 연다. 전체 화면은 다른 페이지로 넘어가면 풀리므로,
// 이 페이지를 전체 화면으로 두고 모니터 화면(./?kiosk=1)을 화면 가득 띄운다. Esc 로 전체 화면만 풀린다
document.querySelector('#viewer .vbtn').addEventListener('click', (e) => {
  e.preventDefault();
  // 기다리지 않는다: 전체 화면이 막힌 브라우저에서는 응답이 없을 수 있다. 그때는 전체 화면 없이 그대로 연다
  try { const p = document.documentElement.requestFullscreen(); if (p) p.catch(() => {}); } catch (_) {}
  const f = document.createElement('iframe');
  f.src = './?kiosk=1';
  f.className = 'kframe';
  f.title = '시험장 현황판';
  document.getElementById('login').hidden = true;
  document.body.appendChild(f);
  document.title = '시험장 현황판';
  // 주소창도 모니터 화면 주소로 (페이지는 다시 읽지 않는다). 새로고침하면 모니터 화면이 바로 열린다
  try { history.replaceState(null, '', './?kiosk=1'); } catch (_) {}
});
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true;
  err.textContent = '';
  try {
    await api('api/login', { id: document.getElementById('id').value, password: document.getElementById('pw').value });
    location.href = './';
  } catch (ex) {
    err.textContent = ex.message;
    document.getElementById('pw').value = '';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
