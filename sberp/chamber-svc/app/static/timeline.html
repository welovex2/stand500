      <span><i class="k-nord" style="background:var(--bar)"></i>로데이터 연동 없음</span><span><i class="k-wit" style="background:var(--bar)"></i>고객 입회</span>
      <span><i style="background:repeating-linear-gradient(135deg,#888 0 3px,#bbb 3px 6px)"></i>진행 중</span><span><i style="box-shadow:inset 0 0 0 2px var(--warnTxt)"></i>10시간 이상</span></div>

<script>
const $ = (id) => document.getElementById(id);
const H = 3600e3;
let VIEW = '1', DATA = null, NOW = new Date(), STALE_H = 10, RANGE3 = 7, END3 = null, timer = 0;
const DESC = {
  '1': '',
  '2': '',
  '3': '',
};

// ---------------------------------------------------------------- 데이터
const pd = s => new Date(s.replace(' ', 'T'));
const dstr = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const hm = d => d.toTimeString().slice(0, 5);
const md = d => `${d.getMonth() + 1}/${d.getDate()}`;
const WD = '일월화수목금토';
const isNoRd = r => r.purpose === 'NORD';
const hasTest = r => r.src === 'RAW' || r.purpose === 'TEST';
const kind = r => r.witnessYn ? 'wit' : isNoRd(r) ? 'nord' : hasTest(r) ? 'test' : 'etc';
const MET = { CE: 'CE', RE1: 'RE (1)', RE2: 'RE (2)', RE3: 'RE (3)', ESD: 'ESD', RS: 'RS', EFT: 'EFT', SURGE: 'SURGE', CS: 'CS', MF: 'M-Field' };
const item = r => r.wholeYn ? '시험장 점유' : r.zoneName || (r.src === 'RAW' ? MET[r.metKey] || r.metKey : '');
const place = r => r.chamberName + (item(r) ? ' · ' + item(r) : '');
const what = r => isNoRd(r) ? '로데이터 연동 없음' : hasTest(r) ? (r.testId || '시험') : (r.purposeName || '시험번호 없이 사용');

async function load(from, to) {
  const d = await api(`api/timeline?from=${dstr(from)}&to=${dstr(to)}`);
  NOW = pd(d.now); STALE_H = d.staleHours || 10;
  for (const r of d.rows) { r.s = pd(r.startDt); r.e = r.running ? NOW : pd(r.endDt); }
  DATA = d;
  return d;
}
// 줄: EMC 시험원 (기록 없는 사람 포함) + 기록에만 있는 사람 + 고객 입회 (입회 업체별)
// 입회 업체: 시험번호의 업체 → 없으면 입회자 이름의 괄호 안 소속 ("최윤 (하늘정밀)" → 하늘정밀) → 입회자 이름
const witKey = r => {
  if (r.cmpyName) return r.cmpyName;
  const m = /\(([^()]+)\)\s*$/.exec(r.witnessName || '');
  return (m && m[1].trim()) || r.witnessName || '고객';
};
function lanes(rows) {
  const map = new Map(DATA.members.map(m => [m.memId, { id: m.memId, name: m.memName, rows: [] }]));
  const wits = new Map();
  for (const r of rows) {
    if (r.witnessYn) {
      const k = witKey(r);
      if (!wits.has(k)) wits.set(k, []);
      wits.get(k).push(r);
      continue;
    }
    if (!map.has(r.memId)) map.set(r.memId, { id: r.memId, name: r.memName || r.memId, rows: [] });
    map.get(r.memId).rows.push(r);
  }
  const out = [...map.values()].sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  out.forEach(l => l.rows.sort((a, b) => a.s - b.s));
  // 고객 입회: 업체(입회자)별 한 줄. 같은 업체가 같은 시간에 두 곳 이상이면 그 업체 줄을 겹치지 않게 나눈다
  for (const k of [...wits.keys()].sort((a, b) => a.localeCompare(b, 'ko'))) {
    const subs = [];
    for (const r of wits.get(k).sort((a, b) => a.s - b.s)) {
      const sub = subs.find(x => { const p = x[x.length - 1]; return !p.running && p.e <= r.s; });   // 진행 중이면 끝나지 않은 것
      sub ? sub.push(r) : subs.push([r]);
    }
    subs.forEach((rs, i) => out.push({ id: '@wit:' + k + ':' + i, name: '입회 · ' + k + (i ? ` (${i + 1})` : ''), wit: true, rows: rs }));
  }
  return out;
}
function barHtml(r, lo, hi, unit) {
  const s = Math.max(r.s, lo), e = Math.min(r.e, hi);
  if (e <= s) return '';
  const pos = unit === '%' ? (s - lo) / (hi - lo) * 100 : (s - lo) / H * unit;
  const w = unit === '%' ? (e - s) / (hi - lo) * 100 : (e - s) / H * unit;
  const u = unit === '%' ? '%' : 'px';
  const long = (r.e - r.s) >= STALE_H * H;
  const label = `${place(r)} · ${what(r)}`;
  return `<div class="bar k-${kind(r)}${r.running ? ' run' : ''}${long ? ' long' : ''}${r.s < lo ? ' cut-l' : ''}" ` +
    `style="left:${pos}${u};width:${w}${u}" data-k="${r.src}:${r.seq}" title="${esc(label)}\n${esc(r.startDt)} ~ ${esc(r.running ? '사용 중' : r.endDt)} · ${minText(r.useMin)}">${esc(label)}</div>`;
}
const elapsed = r => Math.round((NOW - r.s) / 60000);

// ---------------------------------------------------------------- 요약 (사용 중 · 대기 · 기록 없음 · 오늘 총)
function summary(ls) {
  const d0 = new Date(NOW); d0.setHours(0, 0, 0, 0);
  const people = ls.filter(l => !l.wit);
  const today = r => r.e > d0;
  const n = { run: 0, idle: 0, none: 0 };
  for (const l of people) n[l.rows.some(r => r.running) ? 'run' : l.rows.some(today) ? 'idle' : 'none']++;
  const tot = ls.flatMap(l => l.rows).reduce((s, r) => s + Math.max(0, Math.min(r.e, NOW) - Math.max(r.s, d0)), 0) / 60000;
  return `<div class="cnt"><div><b style="color:var(--onTxt)">${n.run}</b><span>사용 중</span></div><div><b>${n.idle}</b><span>대기 (오늘 사용함)</span></div>` +
    `<div><b>${n.none}</b><span>오늘 기록 없음</span></div><div><b>${minText(Math.round(tot))}</b><span>오늘 총 사용</span></div></div>`;
}

// ---------------------------------------------------------------- [지금] 카드형 줄 + 타임라인 (기본 보기)
async function view1() {
  const now = new Date();
  await load(new Date(now - 26 * H), now);
  const lo = new Date(NOW - 10 * H), hi = new Date(+NOW + 2 * H);
  const d0 = new Date(NOW); d0.setHours(0, 0, 0, 0);
  const all = lanes(DATA.rows);
  const state = l => {
    const run = l.rows.find(r => r.running);
    if (run) {
      const m = elapsed(run);
      return { o: 0, on: true, chip: '사용 중', line: `${l.wit ? run.witnessName + ' · ' : ''}${place(run)} · ${what(run)}`,
        big: `<div class="we${m >= STALE_H * 60 ? ' w' : ''}">${minText(m)}</div>` };
    }
    const today = l.rows.filter(r => r.e > d0 && !r.running);
    if (today.length) {
      const last = today[today.length - 1];
      return { o: 1, chip: '대기', line: `${l.wit ? last.witnessName + ' · ' : ''}${place(last)} · ${hm(last.e)} 종료`,
        big: `<div class="we idle">${minText(Math.round((NOW - last.e) / 60000))} 전 · 오늘 ${today.length}건</div>` };
    }
    return { o: 2, chip: '없음', line: '오늘 기록 없음', big: '' };
  };
  const rows = all.filter(l => !l.wit || l.rows.some(r => r.e > lo))
    .map(l => ({ l, st: state(l) })).sort((a, b) => (!!a.l.wit - !!b.l.wit) || (a.st.o - b.st.o));
  const tickPct = h => (h - lo) / (hi - lo) * 100;
  let ticks = '';
  for (let t = new Date(lo); t <= hi; t = new Date(+t + H)) {
    const f = new Date(t); f.setMinutes(0, 0, 0); if (f < lo) continue;
    ticks += `<span style="left:${tickPct(f)}%">${f.getHours()}시</span>`;
  }
  const grid = `background-size:${100 / 12}% 100%;background-position:${-((lo.getMinutes() / 60) * 100 / 12)}% 0`;
  const nowPct = tickPct(NOW);
  const label = ['사용 중', '대기', '오늘 기록 없음'];
  let html = summary(all) + `<div class="box lbox" style="padding:0;overflow:hidden"><div class="g1"><div class="hd"></div><div class="hd">${ticks}</div>`;
  let lastO = -1;
  rows.forEach(({ l, st }, i) => {
    const o = l.wit ? 3 : st.o;
    if (o !== lastO) {
      const grp = rows.filter(x => (x.l.wit ? 3 : x.st.o) === o);
      const runN = grp.reduce((n, x) => n + x.l.rows.filter(r => r.running).length, 0);
      html += `<div class="grp">${l.wit ? `고객 입회 (시험원 없음) · ${new Set(grp.map(x => x.l.rows[0] && witKey(x.l.rows[0]))).size}곳` +
        (runN ? ` · ${runN}건 진행 중` : '') : `${label[o]} · ${grp.length}`}</div>`;
      lastO = o;
    }
    const alt = i % 2 ? ' alt' : '';
    const chip = l.wit ? (st.on ? '진행 중' : '종료') : st.chip;
    const card = `<div class="wh"><span class="av">${esc(l.wit ? '입' : l.name[0])}</span><b title="${esc(l.name)}">${esc(l.name)}</b><span class="st">${chip}</span></div>` +
      `<div class="wl" title="${esc(st.line)}">${esc(st.line)}</div>${st.big}`;
    html += `<div class="who${alt}${st.on ? ' on' : ''}">${card}</div>` +
      `<div class="lane${alt}" style="${grid}">${l.rows.map(r => barHtml(r, lo, hi, '%')).join('')}` +
      `<div class="future" style="left:${nowPct}%"></div><div class="nowline" style="left:${nowPct}%">${i === 0 ? `<b>${hm(NOW)}</b>` : ''}</div></div>`;
  });
  html += '</div></div>';
  $('view').innerHTML = html;
}

// ---------------------------------------------------------------- 모니터 모드: 시험원 카드
async function view2() {
  const now = new Date();
  await load(now, now);
  const d0 = new Date(NOW); d0.setHours(0, 0, 0, 0);
  const lo = new Date(+d0 + 7 * H), hi = new Date(+d0 + 21 * H);   // 7시~21시
  const ls = lanes(DATA.rows).filter(l => !l.wit || l.rows.length);
  const info = ls.map(l => {
    const run = l.rows.find(r => r.running);
    const tot = l.rows.reduce((s, r) => s + Math.max(0, Math.min(r.e, NOW) - Math.max(r.s, d0)), 0) / 60000;
    const last = [...l.rows].reverse().find(r => !r.running);
    return { l, run, tot, last, o: run ? 0 : l.rows.length ? 1 : 2 };
  }).sort((a, b) => (!!a.l.wit - !!b.l.wit) || (a.o - b.o) || a.l.name.localeCompare(b.l.name, 'ko'));
  let html = summary(ls) + '<div class="cards">';
  for (const x of info) {
    const r = x.run;
    const cur = r
      ? `<div class="t">${esc(place(r))}</div><div class="s">${esc(x.l.wit ? r.witnessName : what(r))}${!x.l.wit && r.cmpyName ? ' · ' + esc(r.cmpyName) : ''} · ${hm(r.s)} 시작</div>` +
        `<div class="el${elapsed(r) >= STALE_H * 60 ? ' w' : ''}">${minText(elapsed(r))}</div>`
      : x.last ? `<div class="t" style="color:var(--sub)">${x.l.wit ? '종료' : '대기 중'}</div><div class="s">마지막: ${esc(place(x.last))} · ${hm(x.last.e)} 종료 (${minText(Math.round((NOW - x.last.e) / 60000))} 전)</div>`
      : '<div class="t" style="color:var(--dim)">오늘 기록 없음</div>';
    const nowPct = Math.min(100, Math.max(0, (NOW - lo) / (hi - lo) * 100));
    html += `<div class="pc${r ? ' on' : ''}"><div class="ph"><span class="av">${esc(x.l.wit ? '입' : x.l.name[0])}</span><b>${esc(x.l.name)}</b>` +
      `<span class="st">${r ? (x.l.wit ? '진행 중' : '사용 중') : x.l.wit ? '종료' : x.l.rows.length ? '대기' : '없음'}</span></div><div class="cur">${cur}</div>` +
      `<div class="mini">${x.l.rows.map(q => barHtml(q, lo, hi, '%').replace(/>[^<]*<\/div>$/, '></div>')).join('')}<div class="nowline" style="left:${nowPct}%"></div></div>` +
      `<div class="ticks"><span>7시</span><span>10</span><span>13</span><span>16</span><span>19</span><span>21시</span></div>` +
      `<div class="ft"><span>오늘 ${x.l.rows.length}건</span><span>합계 <b>${minText(Math.round(x.tot))}</b></span></div></div>`;
  }
  $('view').innerHTML = html + '</div>';
}

// ---------------------------------------------------------------- ③ 기간 타임라인
async function view3() {
  const end = END3 || new Date();
  const from = new Date(end); from.setDate(from.getDate() - (RANGE3 - 1));
  await load(from, end);
  const lo = new Date(from); lo.setHours(0, 0, 0, 0);
  const hi = new Date(end); hi.setHours(24, 0, 0, 0);
  const px = RANGE3 <= 3 ? 26 : RANGE3 <= 7 ? 12 : 6;          // 1시간 폭
  const W = (hi - lo) / H * px;
  const ls = lanes(DATA.rows);
  let days = '', bg = '';
  for (let d = new Date(lo); d < hi; d.setDate(d.getDate() + 1)) {
    const x = (d - lo) / H * px, we = d.getDay() === 0 || d.getDay() === 6;
    const hours = (px >= 12 ? [6, 12, 18] : [12]).map(h => `<i style="left:${h * px}px">${h}시</i>`).join('');
    days += `<div class="day${we ? ' we' : ''}" style="left:${x}px;width:${24 * px}px"><b>${md(d)} (${WD[d.getDay()]})</b>${hours}</div>`;
    bg += `<div class="night" style="left:${x}px;width:${8 * px}px"></div><div class="night" style="left:${x + 20 * px}px;width:${4 * px}px"></div><div class="dl" style="left:${x}px"></div>`;
  }
  const tot = l => l.rows.reduce((s, r) => s + Math.max(0, Math.min(r.e, hi) - Math.max(r.s, lo)), 0) / 60000;
  const nowX = (NOW - lo) / H * px;
  const ctl = `<div class="ctl">${[3, 7, 14].map(n => `<button type="button" class="chip${RANGE3 === n ? ' act' : ''}" data-r="${n}">${n}일</button>`).join('')}` +
    `<span class="div"></span><label class="mark">끝 날짜</label><input type="date" class="inp" id="end3" value="${dstr(end)}">` +
    `<button type="button" class="chip" data-r="today">오늘</button></div>`;
  $('view').innerHTML = ctl + `<div class="box lbox" style="padding:0;overflow:hidden"><div class="g3wrap">` +
    `<div class="col"><div class="c h">시험원</div>${ls.map(l => `<div class="c">${esc(l.name)}</div>`).join('')}</div>` +
    `<div class="g3scroll" id="g3s"><div class="g3" style="width:${W}px"><div class="days">${days}</div>${bg}` +
    ls.map(l => `<div class="lane">${l.rows.map(r => barHtml(r, lo, hi, px)).join('')}</div>`).join('') +
    (NOW >= lo && NOW <= hi ? `<div class="nowline" style="left:${nowX}px;top:46px"></div>` : '') + `</div></div>` +
    `<div class="col r"><div class="c h">합계</div>${ls.map(l => `<div class="c">${minText(Math.round(tot(l)))}</div>`).join('')}</div></div></div>`;
  const sc = $('g3s');
  sc.scrollLeft = Math.max(0, Math.min(nowX, W) - sc.clientWidth + 80);
}

// ---------------------------------------------------------------- 공통
function detail(key) {
  const r = DATA.rows.find(x => `${x.src}:${x.seq}` === key);
  if (!r) return;
  // 왼쪽: 시작 → 사용 시간 → 종료(지금) 흐름, 오른쪽: 누가·무엇을 (시안 B, 2026-11-24)
  const k = kind(r), min = r.running ? elapsed(r) : r.useMin, long = r.running && min >= STALE_H * 60;
  const info = [[r.witnessYn ? '입회자' : '시험원', r.witnessYn ? r.witnessName : r.memName],
    ['시험번호', hasTest(r) ? (r.testId || '-') + (r.cmpyName ? ' · ' + r.cmpyName : '') : '-'],
    ['사유 · 메모', (hasTest(r) ? r.memo : [r.purposeName, r.memo].filter(Boolean).join(' · ')) || '-'],
    ['장비 이관', r.linkName ? '⇄ ' + r.linkName : '']].filter(x => x[1]);
  $('modal').className = 'modal mrec k-' + k;
  $('modal').innerHTML = `<div class="rh"><div class="ri">${r.src === 'RAW' ? 'RAW' : k === 'wit' ? '입회' : 'ETC'}</div>` +
    `<div class="rt"><b>${esc(place(r))}</b><span>${{ test: '시험', etc: '시험번호 없이 사용', nord: '로데이터 연동 없음', wit: '고객 입회 시험' }[k]} · ${r.src === 'RAW' ? 'ERP 측정' : '현황판'}</span></div>` +
    `<button class="mx" data-close>×</button></div>` +
    `<div class="rb"><ol class="steps"><li class="done"><span>시작</span><b>${esc(r.startDt)}</b></li>` +
    `<li class="gap${r.running ? (long ? ' w' : '') : ' fin'}"><b>${minText(min)}</b>${r.running ? '지금까지' : '사용'}</li>` +
    `<li class="${r.running ? 'now' : 'done'}"><span>${r.running ? '지금' : '종료'}</span><b>${r.running ? '사용 중' : esc(r.endDt)}</b></li></ol>` +
    `<div class="kv">${info.map(([t, v]) => `<div><span>${t}</span><b>${esc(v)}</b></div>`).join('')}</div></div>` +
    (long ? `<div class="rw">${STALE_H}시간 넘게 사용 중입니다. 종료를 빠뜨렸는지 확인해 주세요.</div>` : '') +
    `<div class="mf">${r.erpUrl ? `<a class="btn sec" href="${esc(r.erpUrl)}" target="_blank" rel="noopener">ERP 로데이터</a>` : ''}<button class="btn pri" data-close>닫기</button></div>`;
  $('ov').classList.add('show');
}
function notice(msg) { $('notice').textContent = msg || ''; $('notice').classList.toggle('on', !!msg); }
const MONITOR = () => document.body.classList.contains('monitor');
async function show(v) {
  if (MONITOR()) v = '2';                 // 모니터 모드는 언제나 카드
  else if (v === '2') v = '1';
  VIEW = v;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('act', b.dataset.v === v));
  $('desc').textContent = DESC[v];
  if (v !== '2') try { localStorage.setItem('tlView', v); } catch (e) {}
  clearInterval(timer);
  try {
    await ({ 1: view1, 2: view2, 3: view3 })[v]();
    notice('');
  } catch (e) {
    // 빈 화면으로 두지 않는다 (서버에 연결되지 않았거나 조회 실패)
    notice(e.message);
    $('view').innerHTML = `<div class="box lbox empty" style="padding:40px;text-align:center;color:var(--muted)">` +
      `시험원 현황을 불러오지 못했습니다. ${esc(e.message || '')}</div>`;
  }
  if (v !== '3') timer = setInterval(() => ({ 1: view1, 2: view2 })[v]().catch(e => notice(e.message)), 60000);
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button, .bar');
  if (!b) { if (e.target === $('ov')) $('ov').classList.remove('show'); return; }
  if (b.id === 'monBtn') {
    const on = document.body.classList.toggle('monitor');
    b.dataset.tip = on ? '모니터 모드 해제' : '모니터용 확대';
    let last = '1';
    try { last = localStorage.getItem('tlView') || '1'; } catch (e) {}
    show(on ? '2' : last);
  }
  else if (b.dataset.v) show(b.dataset.v);
  else if (b.dataset.k) detail(b.dataset.k);
  else if (b.dataset.close !== undefined) $('ov').classList.remove('show');
  else if (b.dataset.r) { if (b.dataset.r === 'today') END3 = null; else RANGE3 = Number(b.dataset.r); show('3'); }
});
document.addEventListener('change', (e) => { if (e.target.id === 'end3' && e.target.value) { END3 = new Date(e.target.value + 'T12:00'); show('3'); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('ov').classList.remove('show'); });

(async () => {
  let v = '1';
  if (location.protocol === 'file:') {
    // 파일을 바로 열면 서버(API)가 없어 아무것도 불러올 수 없다
    $('view').innerHTML = '<div class="box lbox" style="padding:40px;text-align:center;color:var(--muted)">' +
      '파일을 바로 연 화면이라 데이터를 불러올 수 없습니다. 서버 주소(…/timeline.html)로 열어 주세요.</div>';
    return;
  }
  let me;
  try { me = await initPage(); } catch (e) { notice('연결 끊김: ' + e.message); return; }
  if (!me.timelineMenu) {               // 기술책임자·관리자만
    document.querySelector('.tl-top').hidden = true; $('desc').hidden = true;
    $('view').innerHTML = '<div class="box lbox" style="padding:40px;text-align:center;color:var(--muted)">' +
      '시험원 현황은 기술책임자·관리자만 볼 수 있습니다.</div>';
    return;
  }
  try { v = localStorage.getItem('tlView') || '1'; } catch (e) {}
  if (v !== '3') v = '1';
  show(v);
})();
</script>
</body>
</html>
