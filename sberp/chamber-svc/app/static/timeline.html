<!doctype html>
<html lang="ko" class="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시험원 현황</title>
<script>try { if (localStorage.getItem('chamberTheme') === 'dark') document.documentElement.classList.remove('light'); } catch (e) {}</script>
<link rel="stylesheet" href="app.css">
<style>
/* ---------- 시험원 현황: [지금] 카드형 줄 + 타임라인 / [기간] 여러 날 / 모니터 모드는 카드 ---------- */
.tl-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.tl-top h2 { margin: 0; }
.tl-top .sp { flex: 1; }
.tabs3 { display: inline-flex; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.tabs3 button { border: 0; background: none; color: var(--sub); font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.tabs3 button.act { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--sub); align-items: center; }
.legend i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.desc { font-size: 12.5px; color: var(--muted); margin: -4px 0 12px; }

/* 막대 색 (구분) */
.k-test { --bar: var(--accent); }
.k-etc  { --bar: #e8913a; }
.k-nord { --bar: #8a93a3; }
.k-wit  { --bar: #8b6cf0; }
.bar { position: absolute; top: 5px; bottom: 5px; min-width: 3px; border-radius: 5px; background: var(--bar);
  color: #fff; font-size: 11px; font-weight: 600; line-height: 1; display: flex; align-items: center; padding: 0 6px;
  overflow: hidden; white-space: nowrap; cursor: pointer; box-sizing: border-box; }
.bar:hover { filter: brightness(1.08); z-index: 2; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.bar.run { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.18) 0 6px, transparent 6px 12px); }
.bar.run::after { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 3px; background: #fff; opacity: .9; animation: blink 1.4s infinite; }
.bar.long { box-shadow: inset 0 0 0 2px var(--warnTxt); }
.bar.cut-l { border-top-left-radius: 0; border-bottom-left-radius: 0; }
@keyframes blink { 50% { opacity: .2; } }
.nowline { position: absolute; top: 0; bottom: 0; width: 2px; background: #e5484d; z-index: 3; pointer-events: none; }
.nowline b { position: absolute; top: -18px; left: -18px; font-size: 10.5px; color: #e5484d; background: var(--panel); padding: 0 3px; border-radius: 3px; }

/* ① 지금 기준 타임라인 */
.g1 { display: grid; grid-template-columns: 250px 1fr; }
.g1 .hd { height: 30px; position: relative; border-bottom: 1px solid var(--line); }
.g1 .hd span { position: absolute; top: 8px; font-size: 11px; color: var(--muted); transform: translateX(-50%); }
.g1 .who { padding: 8px 12px 8px 10px; border-bottom: 1px solid var(--line); min-height: 66px; box-sizing: border-box;
  border-left: 3px solid transparent; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; }
.g1 .who.on { border-left-color: var(--onTxt); }
.g1 .wh { display: flex; align-items: center; gap: 7px; }
.g1 .wh .av { width: 24px; height: 24px; border-radius: 50%; background: var(--soft); display: grid; place-items: center;
  font-size: 11.5px; font-weight: 700; color: var(--sub); flex: none; }
.g1 .who.on .wh .av { background: var(--onBg2); color: var(--onTxt); }
.g1 .wh b { font-size: 13.5px; }
.g1 .wh .st { margin-left: auto; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 9px; background: var(--soft); color: var(--muted); }
.g1 .who.on .wh .st { background: var(--onBg2); color: var(--onTxt); }
.g1 .wl { font-size: 11.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 31px; }
.g1 .we { font-size: 16px; font-weight: 700; color: var(--onTxt); padding-left: 31px; line-height: 1.2; }
.g1 .we.w { color: var(--warnTxt); }
.g1 .we.idle { font-size: 11.5px; font-weight: 500; color: var(--muted); }
.g1 .lane { position: relative; border-bottom: 1px solid var(--line); min-height: 66px;
  background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); }
.g1 .lane.alt, .g1 .who.alt { background-color: var(--sunk); }
.g1 .lane .bar { top: 16px; bottom: 16px; }
.g1 .future { position: absolute; top: 0; bottom: 0; right: 0; background: repeating-linear-gradient(135deg, transparent 0 6px, var(--soft) 6px 8px); opacity: .6; pointer-events: none; }
.g1 .grp { grid-column: 1 / -1; font-size: 11.5px; font-weight: 700; color: var(--muted); padding: 10px 12px 4px; letter-spacing: .02em; }

/* ② 시험원 카드 */
.cnt { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.cnt div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; min-width: 120px; }
.cnt b { font-size: 22px; display: block; }
.cnt span { font-size: 12px; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.pc { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px; }
.pc.on { border-color: var(--onTxt); box-shadow: 0 0 0 1px var(--onTxt) inset; }
.pc .ph { display: flex; align-items: center; gap: 10px; }
.pc .ph .av { width: 34px; height: 34px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-weight: 700; color: var(--sub); }
.pc.on .ph .av { background: var(--onBg2); color: var(--onTxt); }
.pc .ph b { font-size: 15px; }
.pc .ph .st { margin-left: auto; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 10px; background: var(--soft); color: var(--muted); }
.pc.on .ph .st { background: var(--onBg2); color: var(--onTxt); }
.pc .cur { min-height: 46px; }
.pc .cur .t { font-size: 14px; font-weight: 600; }
.pc .cur .s { font-size: 12px; color: var(--muted); margin-top: 3px; }
.pc .cur .el { font-size: 22px; font-weight: 700; color: var(--onTxt); }
.pc .cur .el.w { color: var(--warnTxt); }
.pc .mini { position: relative; height: 16px; background: var(--sunk); border-radius: 4px; }
.pc .mini .bar { top: 2px; bottom: 2px; padding: 0; border-radius: 3px; }
.pc .ticks { display: flex; justify-content: space-between; font-size: 10px; color: var(--dim); margin-top: -6px; }
.pc .ft { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); border-top: 1px solid var(--line); padding-top: 8px; }

/* ③ 기간 타임라인 */
.ctl { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.g3wrap { display: grid; grid-template-columns: 150px 1fr 104px; }
.g3wrap .col { background: var(--panel); position: relative; z-index: 4; }
.g3wrap .col .c { height: 40px; border-bottom: 1px solid var(--line); padding: 0 12px; display: flex; align-items: center; font-size: 13px; font-weight: 600; box-sizing: border-box; }
.g3wrap .col .c.h { height: 46px; font-size: 11.5px; color: var(--muted); font-weight: 700; }
.g3wrap .col.r .c { white-space: nowrap; justify-content: flex-end; font-variant-numeric: tabular-nums; color: var(--sub); }
.g3scroll { overflow-x: auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
.g3 { position: relative; }
.g3 .days { height: 46px; position: relative; border-bottom: 1px solid var(--line); }
.g3 .day { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line2); }
.g3 .day b { position: absolute; top: 5px; left: 6px; font-size: 12px; white-space: nowrap; }
.g3 .day.we b { color: #e5484d; }
.g3 .day i { position: absolute; bottom: 4px; font-size: 10px; color: var(--dim); font-style: normal; transform: translateX(-50%); }
.g3 .lane { position: relative; height: 40px; border-bottom: 1px solid var(--line); }
.g3 .night { position: absolute; top: 46px; bottom: 0; background: var(--sunk); pointer-events: none; }
.g3 .dl { position: absolute; top: 46px; bottom: 0; width: 1px; background: var(--line2); pointer-events: none; }
.g3 .bar { top: 7px; bottom: 7px; font-size: 10.5px; }

.dt { display: grid; grid-template-columns: 90px 1fr; gap: 8px 12px; font-size: 13.5px; }
.dt dt { color: var(--muted); }
.dt dd { margin: 0; }
/* 모니터 모드 (벽걸이): 카드만 크게. 보기 전환 · 범례 · 설명은 숨긴다 */
body.monitor .tl-top .tabs3, body.monitor .tl-top .legend, body.monitor .desc { display: none; }
body.monitor .page { max-width: none; }
body.monitor .cnt b { font-size: 34px; }
body.monitor .cnt span { font-size: 15px; }
body.monitor .cards { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
body.monitor .pc { padding: 18px 20px 14px; }
body.monitor .pc .ph b { font-size: 20px; }
body.monitor .pc .cur .t { font-size: 18px; }
body.monitor .pc .cur .s { font-size: 14px; }
body.monitor .pc .cur .el { font-size: 32px; }
body.monitor .pc .mini { height: 22px; }
@media (max-width: 720px) { .g1 { grid-template-columns: 150px 1fr; } .g3wrap { grid-template-columns: 96px 1fr 60px; } }
</style>
</head>
<body>
<header>
  <a class="logo" href="./"><img src="logo.svg" alt="Standard Bank"></a>
  <nav><a href="./">시험장 현황판</a><a href="history.html">시험장 사용 이력</a><a class="on" href="timeline.html">시험원 현황</a><a id="navAdmin" href="admin.html" hidden>관리</a></nav>
  <div class="sp"></div>
  <button class="hbtn" id="monBtn" data-tip="모니터용 확대"><i class="ic ic-max"></i></button>
  <button class="hbtn" id="thBtn" data-tip="다크 모드"><i class="ic ic-moon"></i></button>
  <div class="acct" id="acct"><div class="av" id="accAv"></div><div><div class="nm" id="who"></div><span class="rb" id="accRb"></span></div><span class="caret"><i class="ic ic-down"></i></span>
    <div class="menu" id="menu"><button class="lo" id="logout">로그아웃</button></div></div>
</header>

<main class="page">
  <div class="tl-top">
    <h2>시험원 현황</h2>
    <div class="tabs3" id="tabs">
      <button type="button" data-v="1">지금</button>
      <button type="button" data-v="3">기간</button>
    </div>
    <div class="sp"></div>
    <div class="legend"><span><i class="k-test" style="background:var(--bar)"></i>시험</span><span><i class="k-etc" style="background:var(--bar)"></i>시험번호 없이 사용</span>
      <span><i class="k-nord" style="background:var(--bar)"></i>로데이터 연동 없음</span><span><i class="k-wit" style="background:var(--bar)"></i>고객 입회</span>
      <span><i style="background:repeating-linear-gradient(135deg,#888 0 3px,#bbb 3px 6px)"></i>진행 중</span><span><i style="box-shadow:inset 0 0 0 2px var(--warnTxt)"></i>10시간 이상</span></div>
  </div>
  <p class="desc" id="desc"></p>
  <div id="view"></div>
</main>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<script src="app.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const H = 3600e3;
let VIEW = '1', DATA = null, NOW = new Date(), STALE_H = 10, RANGE3 = 7, END3 = null, timer = 0;
const DESC = {
  '1': '지금을 기준으로 앞 10시간 · 뒤 2시간. 사용 중 → 대기 → 오늘 기록 없음 순서이고, 1분마다 새로 고칩니다. 막대를 누르면 자세히.',
  '2': '',
  '3': '여러 날을 이어서 가로로 스크롤. 밤(20시~8시)은 흐리게, 오른쪽에 기간 합계. 쏠림 · 장시간 · 야간 사용을 볼 때.',
};

// ---------------------------------------------------------------- 데이터
const pd = s => new Date(s.replace(' ', 'T'));
const dstr = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const hm = d => d.toTimeString().slice(0, 5);
const md = d => `${d.getMonth() + 1}/${d.getDate()}`;
const WD = '일월화수목금토';
const isNoRd = r => r.purpose === 'NORD';
const hasTest = r => r.src === 'RAW' || r.purpose === 'TEST';
const kind = r => r.witnessYn ? 'wit' : isNoRd(r) ? 'nord' : hasTest(r) ? 'test' : 'etc';
const MET = { CE: 'CE', RE1: 'RE (1)', RE2: 'RE (2)', RE3: 'RE (3)', ESD: 'ESD', RS: 'RS', EFT: 'EFT', SURGE: 'SURGE', CS: 'CS', MF: 'M-Field' };
const item = r => r.wholeYn ? '시험장 점유' : r.zoneName || (r.src === 'RAW' ? MET[r.metKey] || r.metKey : '');
const place = r => r.chamberName + (item(r) ? ' · ' + item(r) : '');
const what = r => isNoRd(r) ? '로데이터 연동 없음' : hasTest(r) ? (r.testId || '시험') : (r.purposeName || '시험번호 없이 사용');

async function load(from, to) {
  const d = await api(`api/timeline?from=${dstr(from)}&to=${dstr(to)}`);
  NOW = pd(d.now); STALE_H = d.staleHours || 10;
  for (const r of d.rows) { r.s = pd(r.startDt); r.e = r.running ? NOW : pd(r.endDt); }
  DATA = d;
  return d;
}
// 줄: EMC 시험원 (기록 없는 사람 포함) + 기록에만 있는 사람 + 고객 입회
function lanes(rows) {
  const map = new Map(DATA.members.map(m => [m.memId, { id: m.memId, name: m.memName, rows: [] }]));
  const wit = { id: '@wit', name: '고객 입회', wit: true, rows: [] };
  for (const r of rows) {
    if (r.witnessYn) { wit.rows.push(r); continue; }
    if (!map.has(r.memId)) map.set(r.memId, { id: r.memId, name: r.memName || r.memId, rows: [] });
    map.get(r.memId).rows.push(r);
  }
  const out = [...map.values()].sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  if (wit.rows.length) out.push(wit);
  out.forEach(l => l.rows.sort((a, b) => a.s - b.s));
  return out;
}
function barHtml(r, lo, hi, unit) {
  const s = Math.max(r.s, lo), e = Math.min(r.e, hi);
  if (e <= s) return '';
  const pos = unit === '%' ? (s - lo) / (hi - lo) * 100 : (s - lo) / H * unit;
  const w = unit === '%' ? (e - s) / (hi - lo) * 100 : (e - s) / H * unit;
  const u = unit === '%' ? '%' : 'px';
  const long = (r.e - r.s) >= STALE_H * H;
  const label = `${place(r)} · ${what(r)}`;
  return `<div class="bar k-${kind(r)}${r.running ? ' run' : ''}${long ? ' long' : ''}${r.s < lo ? ' cut-l' : ''}" ` +
    `style="left:${pos}${u};width:${w}${u}" data-k="${r.src}:${r.seq}" title="${esc(label)}\n${esc(r.startDt)} ~ ${esc(r.running ? '사용 중' : r.endDt)} · ${minText(r.useMin)}">${esc(label)}</div>`;
}
const elapsed = r => Math.round((NOW - r.s) / 60000);

// ---------------------------------------------------------------- 요약 (사용 중 · 대기 · 기록 없음 · 오늘 총)
function summary(ls) {
  const d0 = new Date(NOW); d0.setHours(0, 0, 0, 0);
  const people = ls.filter(l => !l.wit);
  const today = r => r.e > d0;
  const n = { run: 0, idle: 0, none: 0 };
  for (const l of people) n[l.rows.some(r => r.running) ? 'run' : l.rows.some(today) ? 'idle' : 'none']++;
  const tot = ls.flatMap(l => l.rows).reduce((s, r) => s + Math.max(0, Math.min(r.e, NOW) - Math.max(r.s, d0)), 0) / 60000;
  return `<div class="cnt"><div><b style="color:var(--onTxt)">${n.run}</b><span>사용 중</span></div><div><b>${n.idle}</b><span>대기 (오늘 사용함)</span></div>` +
    `<div><b>${n.none}</b><span>오늘 기록 없음</span></div><div><b>${minText(Math.round(tot))}</b><span>오늘 총 사용</span></div></div>`;
}

// ---------------------------------------------------------------- [지금] 카드형 줄 + 타임라인 (기본 보기)
async function view1() {
  const now = new Date();
  await load(new Date(now - 26 * H), now);
  const lo = new Date(NOW - 10 * H), hi = new Date(+NOW + 2 * H);
  const d0 = new Date(NOW); d0.setHours(0, 0, 0, 0);
  const all = lanes(DATA.rows);
  const state = l => {
    const run = l.rows.find(r => r.running);
    if (run) {
      const m = elapsed(run);
      return { o: 0, on: true, chip: '사용 중', line: `${place(run)} · ${what(run)}`,
        big: `<div class="we${m >= STALE_H * 60 ? ' w' : ''}">${minText(m)}</div>` };
    }
    const today = l.rows.filter(r => r.e > d0 && !r.running);
    if (today.length) {
      const last = today[today.length - 1];
      return { o: 1, chip: '대기', line: `${place(last)} · ${hm(last.e)} 종료`,
        big: `<div class="we idle">${minText(Math.round((NOW - last.e) / 60000))} 전 · 오늘 ${today.length}건</div>` };
    }
    return { o: 2, chip: '없음', line: '오늘 기록 없음', big: '' };
  };
  const rows = all.filter(l => !l.wit || l.rows.some(r => r.e > lo))
    .map(l => ({ l, st: state(l) })).sort((a, b) => (a.l.wit - b.l.wit) || (a.st.o - b.st.o));
  const tickPct = h => (h - lo) / (hi - lo) * 100;
  let ticks = '';
  for (let t = new Date(lo); t <= hi; t = new Date(+t + H)) {
    const f = new Date(t); f.setMinutes(0, 0, 0); if (f < lo) continue;
    ticks += `<span style="left:${tickPct(f)}%">${f.getHours()}시</span>`;
  }
  const grid = `background-size:${100 / 12}% 100%;background-position:${-((lo.getMinutes() / 60) * 100 / 12)}% 0`;
  const nowPct = tickPct(NOW);
  const label = ['사용 중', '대기', '오늘 기록 없음'];
  let html = summary(all) + `<div class="box lbox" style="padding:0;overflow:hidden"><div class="g1"><div class="hd"></div><div class="hd">${ticks}</div>`;
  let lastO = -1;
  rows.forEach(({ l, st }, i) => {
    const o = l.wit ? 3 : st.o;
    if (o !== lastO) { html += `<div class="grp">${l.wit ? '고객 입회 (시험원 없음)' : label[o]} · ${rows.filter(x => (x.l.wit ? 3 : x.st.o) === o).length}</div>`; lastO = o; }
    const alt = i % 2 ? ' alt' : '';
    const card = l.wit
      ? `<div class="wh"><span class="av">입</span><b>${esc(l.name)}</b></div><div class="wl">시험원 없이 진행한 입회 시험</div>`
      : `<div class="wh"><span class="av">${esc(l.name[0])}</span><b>${esc(l.name)}</b><span class="st">${st.chip}</span></div>` +
        `<div class="wl" title="${esc(st.line)}">${esc(st.line)}</div>${st.big}`;
    html += `<div class="who${alt}${st.on && !l.wit ? ' on' : ''}">${card}</div>` +
      `<div class="lane${alt}" style="${grid}">${l.rows.map(r => barHtml(r, lo, hi, '%')).join('')}` +
      `<div class="future" style="left:${nowPct}%"></div><div class="nowline" style="left:${nowPct}%">${i === 0 ? `<b>${hm(NOW)}</b>` : ''}</div></div>`;
  });
  html += '</div></div>';
  $('view').innerHTML = html;
}

// ---------------------------------------------------------------- 모니터 모드: 시험원 카드
async function view2() {
  const now = new Date();
  await load(now, now);
  const d0 = new Date(NOW); d0.setHours(0, 0, 0, 0);
  const lo = new Date(+d0 + 7 * H), hi = new Date(+d0 + 21 * H);   // 7시~21시
  const ls = lanes(DATA.rows).filter(l => !l.wit || l.rows.length);
  const info = ls.map(l => {
    const run = l.rows.find(r => r.running);
    const tot = l.rows.reduce((s, r) => s + Math.max(0, Math.min(r.e, NOW) - Math.max(r.s, d0)), 0) / 60000;
    const last = [...l.rows].reverse().find(r => !r.running);
    return { l, run, tot, last, o: run ? 0 : l.rows.length ? 1 : 2 };
  }).sort((a, b) => (a.l.wit - b.l.wit) || (a.o - b.o) || a.l.name.localeCompare(b.l.name, 'ko'));
  let html = summary(ls) + '<div class="cards">';
  for (const x of info) {
    const r = x.run;
    const cur = r
      ? `<div class="t">${esc(place(r))}</div><div class="s">${esc(what(r))}${r.cmpyName ? ' · ' + esc(r.cmpyName) : ''} · ${hm(r.s)} 시작</div>` +
        `<div class="el${elapsed(r) >= STALE_H * 60 ? ' w' : ''}">${minText(elapsed(r))}</div>`
      : x.last ? `<div class="t" style="color:var(--sub)">대기 중</div><div class="s">마지막: ${esc(place(x.last))} · ${hm(x.last.e)} 종료 (${minText(Math.round((NOW - x.last.e) / 60000))} 전)</div>`
      : '<div class="t" style="color:var(--dim)">오늘 기록 없음</div>';
    const nowPct = Math.min(100, Math.max(0, (NOW - lo) / (hi - lo) * 100));
    html += `<div class="pc${r ? ' on' : ''}"><div class="ph"><span class="av">${esc(x.l.wit ? '입' : x.l.name[0])}</span><b>${esc(x.l.name)}</b>` +
      `<span class="st">${r ? '사용 중' : x.l.rows.length ? '대기' : '없음'}</span></div><div class="cur">${cur}</div>` +
      `<div class="mini">${x.l.rows.map(q => barHtml(q, lo, hi, '%').replace(/>[^<]*<\/div>$/, '></div>')).join('')}<div class="nowline" style="left:${nowPct}%"></div></div>` +
      `<div class="ticks"><span>7시</span><span>10</span><span>13</span><span>16</span><span>19</span><span>21시</span></div>` +
      `<div class="ft"><span>오늘 ${x.l.rows.length}건</span><span>합계 <b>${minText(Math.round(x.tot))}</b></span></div></div>`;
  }
  $('view').innerHTML = html + '</div>';
}

// ---------------------------------------------------------------- ③ 기간 타임라인
async function view3() {
  const end = END3 || new Date();
  const from = new Date(end); from.setDate(from.getDate() - (RANGE3 - 1));
  await load(from, end);
  const lo = new Date(from); lo.setHours(0, 0, 0, 0);
  const hi = new Date(end); hi.setHours(24, 0, 0, 0);
  const px = RANGE3 <= 3 ? 26 : RANGE3 <= 7 ? 12 : 6;          // 1시간 폭
  const W = (hi - lo) / H * px;
  const ls = lanes(DATA.rows);
  let days = '', bg = '';
  for (let d = new Date(lo); d < hi; d.setDate(d.getDate() + 1)) {
    const x = (d - lo) / H * px, we = d.getDay() === 0 || d.getDay() === 6;
    const hours = (px >= 12 ? [6, 12, 18] : [12]).map(h => `<i style="left:${h * px}px">${h}시</i>`).join('');
    days += `<div class="day${we ? ' we' : ''}" style="left:${x}px;width:${24 * px}px"><b>${md(d)} (${WD[d.getDay()]})</b>${hours}</div>`;
    bg += `<div class="night" style="left:${x}px;width:${8 * px}px"></div><div class="night" style="left:${x + 20 * px}px;width:${4 * px}px"></div><div class="dl" style="left:${x}px"></div>`;
  }
  const tot = l => l.rows.reduce((s, r) => s + Math.max(0, Math.min(r.e, hi) - Math.max(r.s, lo)), 0) / 60000;
  const nowX = (NOW - lo) / H * px;
  const ctl = `<div class="ctl">${[3, 7, 14].map(n => `<button type="button" class="chip${RANGE3 === n ? ' act' : ''}" data-r="${n}">${n}일</button>`).join('')}` +
    `<span class="div"></span><label class="mark">끝 날짜</label><input type="date" class="inp" id="end3" value="${dstr(end)}">` +
    `<button type="button" class="chip" data-r="today">오늘</button></div>`;
  $('view').innerHTML = ctl + `<div class="box lbox" style="padding:0;overflow:hidden"><div class="g3wrap">` +
    `<div class="col"><div class="c h">시험원</div>${ls.map(l => `<div class="c">${esc(l.name)}</div>`).join('')}</div>` +
    `<div class="g3scroll" id="g3s"><div class="g3" style="width:${W}px"><div class="days">${days}</div>${bg}` +
    ls.map(l => `<div class="lane">${l.rows.map(r => barHtml(r, lo, hi, px)).join('')}</div>`).join('') +
    (NOW >= lo && NOW <= hi ? `<div class="nowline" style="left:${nowX}px;top:46px"></div>` : '') + `</div></div>` +
    `<div class="col r"><div class="c h">합계</div>${ls.map(l => `<div class="c">${minText(Math.round(tot(l)))}</div>`).join('')}</div></div></div>`;
  const sc = $('g3s');
  sc.scrollLeft = Math.max(0, Math.min(nowX, W) - sc.clientWidth + 80);
}

// ---------------------------------------------------------------- 공통
function detail(key) {
  const r = DATA.rows.find(x => `${x.src}:${x.seq}` === key);
  if (!r) return;
  const rows = [['시험장', place(r)], ['구분', { test: '시험', etc: '시험번호 없이 사용', nord: '로데이터 연동 없음', wit: '고객 입회 시험' }[kind(r)]],
    ['시험번호', hasTest(r) ? (r.testId || '-') + (r.cmpyName ? ' · ' + r.cmpyName : '') : '-'],
    ['사유 · 메모', hasTest(r) ? r.memo : [r.purposeName, r.memo].filter(Boolean).join(' · ')],
    ['시험원', r.witnessYn ? '입회 · ' + r.witnessName : r.memName], ['시작', r.startDt],
    ['종료', r.running ? '사용 중' : r.endDt], ['사용 시간', minText(r.running ? elapsed(r) : r.useMin)],
    ['장비 이관', r.linkName ? '⇄ ' + r.linkName : '']].filter(x => x[1]);
  $('modal').className = 'modal';
  $('modal').innerHTML = `<div class="mh"><h3>사용 기록<small>${esc(r.src === 'RAW' ? 'ERP 측정' : '현황판')}</small></h3><button class="mx" data-close>×</button></div>` +
    `<div class="mb"><dl class="dt">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>` +
    `<div class="mf">${r.erpUrl ? `<a class="btn sec" href="${esc(r.erpUrl)}" target="_blank" rel="noopener">ERP 로데이터</a>` : ''}<button class="btn pri" data-close>닫기</button></div>`;
  $('ov').classList.add('show');
}
const MONITOR = () => document.body.classList.contains('monitor');
async function show(v) {
  if (MONITOR()) v = '2';                 // 모니터 모드는 언제나 카드
  else if (v === '2') v = '1';
  VIEW = v;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('act', b.dataset.v === v));
  $('desc').textContent = DESC[v];
  if (v !== '2') try { localStorage.setItem('tlView', v); } catch (e) {}
  clearInterval(timer);
  try {
    await ({ 1: view1, 2: view2, 3: view3 })[v]();
    notice('');
  } catch (e) {
    // 빈 화면으로 두지 않는다 (서버에 연결되지 않았거나 조회 실패)
    notice(e.message);
    $('view').innerHTML = `<div class="box lbox empty" style="padding:40px;text-align:center;color:var(--muted)">` +
      `시험원 현황을 불러오지 못했습니다. ${esc(e.message || '')}</div>`;
  }
  if (v !== '3') timer = setInterval(() => ({ 1: view1, 2: view2 })[v]().catch(e => notice(e.message)), 60000);
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button, .bar');
  if (!b) { if (e.target === $('ov')) $('ov').classList.remove('show'); return; }
  if (b.id === 'monBtn') {
    const on = document.body.classList.toggle('monitor');
    b.dataset.tip = on ? '모니터 모드 해제' : '모니터용 확대';
    let last = '1';
    try { last = localStorage.getItem('tlView') || '1'; } catch (e) {}
    show(on ? '2' : last);
  }
  else if (b.dataset.v) show(b.dataset.v);
  else if (b.dataset.k) detail(b.dataset.k);
  else if (b.dataset.close !== undefined) $('ov').classList.remove('show');
  else if (b.dataset.r) { if (b.dataset.r === 'today') END3 = null; else RANGE3 = Number(b.dataset.r); show('3'); }
});
document.addEventListener('change', (e) => { if (e.target.id === 'end3' && e.target.value) { END3 = new Date(e.target.value + 'T12:00'); show('3'); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('ov').classList.remove('show'); });

(async () => {
  let v = '1';
  if (location.protocol === 'file:') {
    // 파일을 바로 열면 서버(API)가 없어 아무것도 불러올 수 없다
    $('view').innerHTML = '<div class="box lbox" style="padding:40px;text-align:center;color:var(--muted)">' +
      '파일을 바로 연 화면이라 데이터를 불러올 수 없습니다. 서버 주소(…/timeline.html)로 열어 주세요.</div>';
    return;
  }
  let me;
  try { me = await initPage(); } catch (e) { notice('연결 끊김: ' + e.message); return; }
  if (me.monitorYn) { document.body.classList.add('monitor'); $('monBtn').hidden = true; }   // 모니터 계정은 항상 카드
  try { v = localStorage.getItem('tlView') || '1'; } catch (e) {}
  if (v !== '3') v = '1';
  show(v);
})();
</script>
