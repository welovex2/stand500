# ERP 를 서비스하는 443 server 블록 안, `location / {` 앞에 붙여 넣는다.
# chamber-svc 컨테이너가 떠 있어야 nginx 가 설정을 읽는다(proxy_pass 호스트 이름 확인).
# chamber-svc 를 먼저 띄우고 reload 한다. 컨테이너를 다시 만든 뒤에도 reload 한다.
# allow 대역은 서버에 맞게 고친다. 172.22.0.0/16 = 172.22.x.x 전체 (사내망).

    location = /chamber {
        return 301 /chamber/;
    }

    # 현황판: 사내망만 허용 (로그인과 별개로 유지)
    location /chamber/ {
        allow 172.22.0.0/16;
        deny  all;

        proxy_pass http://chamber-svc:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
