# stand500.conf 의 ERP 를 서비스하는 443 server 블록 안, `location / {` 앞에 붙여 넣는다.
# (운영은 server_name www.stand500.com; 블록. 서버마다 conf 가 달라 map 변수 등은 쓰지 않는다)
# his-svc 컨테이너가 떠 있어야 nginx 가 설정을 읽는다(proxy_pass 호스트 이름 확인). his-svc 먼저 띄우고 reload 한다.

    location = /his {
        return 301 /his/;
    }

    location /his/ {
        auth_basic           "raw history";
        auth_basic_user_file /etc/nginx/conf.d/his.htpasswd;

        # 사내 IP만 허용하려면 주석 해제 (예: 사무실 공인 IP)
        # allow 1.2.3.4;
        # deny  all;

        proxy_pass http://his-svc:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
